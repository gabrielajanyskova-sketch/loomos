<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#171614" />
    <meta
      name="description"
      content="LOOMOS — ručně vyráběné sójové svíčky v čirém skle s dřevěným knotem. Vonné oleje z Velké Británie s certifikátem IFRA."
    />
    <link
      rel="icon"
      href="/assets/img/favicon-48.png"
      type="image/png"
      sizes="48x48"
    />
    <link rel="stylesheet" href="/assets/css/store.css" />
    <script type="module" src="/assets/js/store.js"></script>
    <title>Obchod — LOOMOS</title>
  </head>
  <body data-page="shop">
    <a class="skip" href="#main">Přejít na obsah</a>
    <div id="site-header"></div>
    <main id="main" class="container page-main">
      <div class="breadcrumb"><a href="/">Domů</a> / Obchod</div>
      <div class="shop-heading">
        <div class="eyebrow">NAJDĚTE SI SVŮJ MALÝ RITUÁL</div>
        <h1>Vůně pro <em>vaše chvíle.</em></h1>
        <p>
          Ručně vyráběné sójové svíčky. Čiré sklo, dřevěný knot a vůně, ke
          kterým se budete vracet.
        </p>
      </div>
      <div class="shop-tools">
        <div class="filter-tabs" aria-label="Kategorie">
          <button class="active" data-filter="all">Všechny svíčky</button
          ><button data-filter="pro-ni">Pro ni</button
          ><button data-filter="pro-nej">Pro něj</button>
        </div>
        <label class="sort-label"
          >Řadit
          <select id="sort">
            <option value="default">Doporučené</option>
            <option value="price-up">Od nejlevnějších</option>
            <option value="price-down">Od nejdražších</option>
            <option value="name">Podle názvu</option>
          </select></label
        >
      </div>
      <div
        id="scent-filter"
        class="scent-filter"
        role="group"
        aria-label="Oblíbená vůně"
      ></div>
      <p id="product-count" class="muted"></p>
      <div
        id="shop-products"
        class="product-grid four-up"
        aria-live="polite"
      ></div>
      <div class="shop-bottom">
        <span
          ><svg
            class="ico"
            viewBox="0 0 32 32"
            aria-hidden="true"
            focusable="false"
          >
            <use href="/assets/img/icons.svg#sparkle" /></svg
        ></span>
        <p>
          Nemůžete si vybrat vůni?
          <a href="mailto:info@loomos.cz">Ráda vám poradím →</a>
        </p>
      </div>
    </main>
    <div id="site-footer"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
