<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/assets/css/store.css" />
    <script type="module" src="/assets/js/store.js"></script>
    <title>Lapače slunce — LOOMOS</title>
  </head>
  <body data-page="suncatchers">
    <a class="skip" href="#main">Přejít na obsah</a>
    <div id="site-header"></div>
    <main id="main" class="container page-main">
      <div class="breadcrumb"><a href="/">Domů</a> / Lapače slunce</div>
      <section class="suncatcher-hero">
        <div class="eyebrow">DUHA NA VAŠÍ ZDI</div>
        <h1>Lapače <em>slunce.</em></h1>
        <p class="lead">

          175 Kč za kus — motivy můžete libovolně kombinovat.
        </p>
      </section>

      <section class="section-tight" aria-label="Nabídka lapačů slunce">
        <div
          id="theme-filter"
          class="scent-filter"
          role="group"
          aria-label="Téma lapače"
        ></div>
        <div
          id="suncatcher-products"
          class="product-grid suncatcher-grid"
          aria-live="polite"
        ></div>

    </main>
    <div id="site-footer"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

</html>
