<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/assets/css/store.css" />
    <script type="module" src="/assets/js/store.js"></script>
    <title>Tvorba na míru — LOOMOS</title>
  </head>
  <body data-page="inquiry">
    <a class="skip" href="#main">Přejít na obsah</a>
    <div id="site-header"></div>
    <main id="main" class="container page-main narrow">
      <div class="breadcrumb"><a href="/">Domů</a> / Tvorba na míru</div>
      <div class="eyebrow">INDIVIDUÁLNÍ POPTÁVKA</div>
      <h1>Tvorba <em>na míru.</em></h1>
      <p class="lead">
        Lapač slunce s vaším pejskem, samolepky s vlastním motivem nebo logo pro
        firmu? Popište mi, co si představujete, a já se vám ozvu s návrhem a
        cenou. Lapač slunce s vaším motivem stojí od 299 Kč. Poptávka je
        nezávazná.
      </p>
      <form id="inquiry-form" class="inquiry-form" novalidate>
        <label class="full"
          >Co byste chtěli?<select name="type" required>
            <option value="lapac-slunce">Lapač slunce</option>
            <option value="samolepka">Samolepka / nálepka</option>
            <option value="logo">Logo (samolepka, polep)</option>
            <option value="jine">Něco jiného</option>
          </select></label
        >
        <label
          >Velikost<input
            name="size"
            maxlength="120"
            placeholder="např. kruh 15 cm, 30 × 20 cm"
        /></label>
        <label
          >Počet kusů<input
            name="quantity"
            type="number"
            min="1"
            max="100000"
            value="1"
            required
        /></label>
        <label class="full"
          >Fólie / materiál<select name="material">
            <option value="">Nevím, poraďte mi</option>
            <option>Duhová (lapač slunce)</option>
            <option>Holografická</option>
            <option>Lesklá barevná</option>
            <option>Matná barevná</option>
            <option>Průhledná s potiskem</option>
          </select></label
        >
        <label class="full"
          >Motiv a popis<textarea
            name="motif"
            rows="5"
            maxlength="3000"
            required
            placeholder="Co má být na obrázku, barvy, text, kam to chcete nalepit…"
          ></textarea>
        </label>
        <label class="full"
          >Obrázek, fotka nebo logo (nepovinné)<input
            name="file"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/svg+xml,application/pdf"
          /><small class="muted"
            >JPG, PNG, WebP, SVG nebo PDF. Fotky z mobilu se samy zmenší.</small
          ></label
        >
        <label class="full"
          >Kdy to potřebujete? (nepovinné)<input
            name="deadline"
            maxlength="120"
            placeholder="např. do Vánoc, k narozeninám 12. 12."
        /></label>
        <label
          >Jméno<input name="name" required maxlength="120" autocomplete="name"
        /></label>
        <label
          >E-mail<input
            name="email"
            type="email"
            required
            maxlength="200"
            autocomplete="email"
        /></label>
        <label class="full"
          >Telefon (nepovinné)<input
            name="phone"
            type="tel"
            maxlength="30"
            autocomplete="tel"
        /></label>
        <label class="check full"
          ><input type="checkbox" name="consent" required /><span
            >Souhlasím se zpracováním údajů kvůli vyřízení poptávky podle
            <a
              href="/ochrana-osobnich-udaju.html"
              target="_blank"
              rel="noopener"
              >zásad ochrany osobních údajů</a
            >.</span
          ></label
        >
        <p id="inquiry-error" class="error full" role="alert"></p>
        <button class="button full" id="inquiry-send">
          Odeslat poptávku →
        </button>
      </form>
    </main>
    <div id="site-footer"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
